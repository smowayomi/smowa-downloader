<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        padding: 20px;
        background: #16181d;
        color: #e9e6df;
        font:
          14px/1.45 "Segoe UI Variable Text",
          "Segoe UI",
          sans-serif;
      }
      h2 {
        margin: 0 0 8px;
      }
      p {
        color: #a1a7b2;
        line-height: 1.6;
      }
      button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 6px;
        background: #e9e6df;
        color: #16181d;
        font-weight: 400;
        font-family: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #6cc0f2;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <h2>Smowa</h2>
    <p id="status">
      Send this video to your desktop to choose quality and download.
    </p>
    <button id="send">Open in Smowa</button>
    <script src="popup.js"></script>
  </body>
</html>
