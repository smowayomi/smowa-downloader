<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        padding: 20px;
        background: #16181d;
        color: #e9e6df;
        font:
          14px/1.45 "Segoe UI Variable Text",
          "Segoe UI",
          sans-serif;
      }
      h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 8px;
      }
      p {
        color: #a1a7b2;
        line-height: 1.6;
      }
      button, #send {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 6px;
        background: #e9e6df;
        color: #16181d;
        font-weight: 400;
        font-family: inherit;
        cursor: pointer;
      }
      button:focus-visible, #send:focus-visible {
        outline: 2px solid #6cc0f2;
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #send { display: block; box-sizing: border-box; text-align: center; text-decoration: none; }
      #details {
        color: #ffb4b5;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .pairing {
        border-top: 1px solid #2b303a;
        margin-top: 16px;
        padding-top: 12px;
        color: #a1a7b2;
        font-size: 11px;
      }
      code {
        display: block;
        margin-top: 5px;
        color: #e9e6df;
        user-select: all;
      }
    </style>
  </head>
  <body>
    <h2><img src="icons/icon-48.png" width="32" height="32" alt="" />SmowaDL</h2>
    <p id="status">
      Send this video to your desktop to choose quality and download.
    </p>
    <a id="send" aria-disabled="true">Open in SmowaDL</a>
    <p id="details" role="alert"></p>
    <div class="pairing" hidden>
      Extension ID � Brave / Chrome<code id="extension-id"></code>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
