name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - name: Prepare bundled resources
        run: ./scripts/prepare-bundle.ps1
      - name: Frontend and Rust checks
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Interface and extension checks
        shell: pwsh
        run: |
          npx playwright install chrome
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/url-check.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/media-buttons-check.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/layout-check.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/improvements-check.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/motion-check.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build signed installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci --bundles nsis
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/release-assets.ps1 -Tag $env:GITHUB_REF_NAME
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "SmowaDL $tag" --notes-file .github/RELEASE_NOTES.md
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          gh release upload $tag (Get-ChildItem release-assets -File).FullName --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
